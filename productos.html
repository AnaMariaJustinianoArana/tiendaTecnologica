<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link rel="stylesheet" href="estilosProductos.css"> 
</head>
<body>
    <h2>Nuestros productos</h2>
        <div class="productos">
            <article class="producto">
                <img src="imagenes2026/animal1.jpg" 
                alt="Computadora portátil">
                <h3>Laptop</h3>
                <p>Ideal para estudiar y trabajar.</p>
                <p class="precio">Bs 6.000</p>
                <button type="button">Ver detalles</button>
            </article>
            <article class="producto">
                <img src="imagenes2026/animal2.jpg"
                     alt="Mouse inalámbrico">
                <h3>Mouse inalámbrico</h3>
                <p>Comodidad y precisión para tu computadora.</p>
                <p class="precio">Bs 150</p>
                <!-- <button type="button">Ver detalles</button> -->
                <button type="button" class="btnDetalle">Ver detalles</button>
                <p class="detalle" hidden>Marca Logitech gamer de 2 botones</p>
                
                
            </article>

            <article class="producto">
                <img src="imagenes2026/animal3.jpg"
                     alt="Teclado para computadora">
                <h3>Teclado</h3>
                <p>Práctico para tus tareas diarias.</p>
                <p class="precio">Bs 250</p>
                <button type="button">Ver detalles</button>
            </article>

            <article class="producto">
                <img src="imagenes2026/animal4.jpg"
                     alt="Monitor de computadora">
                <h3>Monitor</h3>
                <p>Pantalla amplia para trabajar con comodidad.</p>
                <p class="precio">Bs 1.200</p>
                <button type="button">Ver detalles</button>
            </article>
           

        </div>
        <script src="productos.js"></script>
</body>
</html>
