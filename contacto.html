<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto</title>
    <link rel="stylesheet" href="contactoEstilos.css">
</head>
<body>
    <main class="contacto">  
        <!-- indica el contenido principal de la página  -->
        <h2>Contáctanos</h2>
        <form id="formContacto"> 
        <!--id para que js encuentre el formulario -->
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
            <!-- for asocia la etiqueta con el input
            name identifica el dato cuando se envía el formulario al servidor -->
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
            <div class="botones">
                <button type="submit">Enviar</button>
                <button type="reset">limpiar</button>
            </div>
        </form>
        <p id="respuesta"></p> <!--p aqui js mostrará la respuesta -->
    </main>
    <!--aquí va el script de contacto-->
    <script src="contacto.js"></script>
</body>
</html>
